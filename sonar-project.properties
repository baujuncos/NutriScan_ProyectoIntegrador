# Configuración opcional de SonarCloud (solo se usa si SONAR_ENABLED=true y hay SONAR_TOKEN).
# El gate principal del TP NO depende de esto: corre con ESLint, jscpd y la cobertura de Vitest
# (scripts/qa/quality-gate.mjs). Ver docs/SETUP_SECRETS.md.
sonar.projectKey=NutriScan_ProyectoIntegrador
# sonar.organization=<tu-organizacion-en-sonarcloud>
sonar.sources=src
sonar.tests=testing
sonar.test.inclusions=testing/**/*.test.ts,testing/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mismas exclusiones que coverage.exclude de vitest.config.ts, para que los números coincidan.
sonar.coverage.exclusions=src/types/**,src/app/sw.ts,src/app/manifest.ts,src/**/loading.tsx
sonar.cpd.exclusions=**/*.d.ts
sonar.sourceEncoding=UTF-8
